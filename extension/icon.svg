<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="grad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2a1004"/>
      <stop offset="100%" stop-color="#120800"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="22" fill="url(#grad)"/>

  <!-- Rune Ansuz — branches parallèles vers le bas-droit -->
  <g stroke="#c8821a" stroke-width="11" stroke-linecap="round" fill="none">
    <!-- Hampe verticale -->
    <line x1="46" y1="16" x2="46" y2="112"/>
    <!-- Branche haute — part du sommet de la hampe -->
    <line x1="46" y1="16" x2="82" y2="40"/>
    <!-- Branche basse — même dx/dy -->
    <line x1="46" y1="44" x2="82" y2="68"/>
  </g>
</svg>
